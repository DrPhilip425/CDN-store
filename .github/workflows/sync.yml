name: sync
on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

# 用仓库内置 token，推回 main 需要写权限
permissions:
    contents: write

# 避免两次运行互相踩
concurrency:
    group: sync
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: clone
              run: |
                  git clone https://github.com/cdnjs/cdnjs.git --depth=1 --filter=blob:none --no-checkout
                  git clone https://github.com/${{ github.repository }}.git static --depth=1 --filter=blob:none --no-checkout
            - name: checkout
              run: |
                  cd cdnjs
                  git sparse-checkout init --cone
                  for i in ${{ vars.LIBS }}
                  do
                  git sparse-checkout add ajax/libs/$i
                  done
                  git checkout
                  cd ../static
                  git sparse-checkout init --cone
                  git sparse-checkout set libs
                  git checkout
            - name: sync
              run: |
                  rm -rf static/libs
                  cp -r cdnjs/ajax/libs static/libs
            - name: commit
              run: |
                  cd static
                  git config --global user.name github-actions[bot]
                  git config --global user.email github-actions[bot]@users.noreply.github.com
                  git add .
                  git commit --allow-empty -m "chore: sync libs"
            - name: push
              env:
                  TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd static
                  # token 为空时立刻报明确错误，而不是含糊的 exit code 1
                  test -n "$TOKEN" || { echo "::error::GITHUB_TOKEN 为空"; exit 1; }

                  # 凭据放在 header 里而不是 URL 里：即使 GitHub 返回 301 跳转也不会丢
                  AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"

                  for i in 1 2 3; do
                    if git -c http.https://github.com/.extraheader="$AUTH" push origin HEAD:main; then
                      echo "push 成功（第 $i 次尝试）"
                      exit 0
                    fi
                    echo "push 失败（第 $i 次），15 秒后重试"
                    sleep 15
                  done
                  echo "::error::push 连续 3 次失败，请看上面的报错"
                  exit 1
